    <style>
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #111111;
            --bg-card: #1a1a1a;
            --text-primary: #f5f5f5;
            --text-secondary: #a0a0a0;
            --text-tertiary: #707070;
            --accent-primary: #d4af37;
            --accent-secondary: #b8960f;
            --accent-dim: rgba(212, 175, 55, 0.15);
            --border-subtle: rgba(255, 255, 255, 0.06);
            --border-medium: rgba(255, 255, 255, 0.12);
            --border-active: rgba(212, 175, 55, 0.4);
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.4);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.6);
            --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.8);
            --radius-sm: 6px;
            --radius-md: 12px;
            --radius-lg: 20px;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --font-display: 'Playfair Display', 'Times New Roman', serif;
            --transition-fast: 0.2s cubic-bezier(0.25, 0.1, 0.25, 1);
            --transition-smooth: 0.35s cubic-bezier(0.25, 0.1, 0.25, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-sans);
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            letter-spacing: -0.01em;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 0 24px;
        }

        nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-subtle);
            padding: 16px 0;
        }

        nav .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .nav-brand {
            font-family: var(--font-display);
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            color: var(--accent-primary);
            text-decoration: none;
            white-space: nowrap;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.02em;
            transition: color var(--transition-fast);
            white-space: nowrap;
        }

        .nav-links a:hover {
            color: var(--accent-primary);
        }

        .page-header {
            padding: 64px 0 40px;
            text-align: center;
            border-bottom: 1px solid var(--border-subtle);
            margin-bottom: 48px;
        }

        .page-header .kicker {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--accent-primary);
            margin-bottom: 16px;
            font-weight: 600;
        }

        .page-header h1 {
            font-family: var(--font-display);
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 700;
            line-height: 1.25;
            letter-spacing: -0.02em;
            margin-bottom: 16px;
            color: var(--text-primary);
        }

        .page-header .lead {
            font-size: 1.1rem;
            color: var(--text-secondary);
            max-width: 640px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .content-section {
            margin-bottom: 56px;
        }

        .content-section h2 {
            font-family: var(--font-display);
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.015em;
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--border-active);
            display: inline-block;
        }

        .content-section h3 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 12px;
            margin-top: 28px;
            color: var(--text-primary);
        }

        .content-section p {
            color: var(--text-secondary);
            margin-bottom: 16px;
            line-height: 1.75;
        }

        .content-section strong {
            color: var(--text-primary);
            font-weight: 600;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin: 32px 0;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 28px 24px;
            transition: border-color var(--transition-smooth), box-shadow var(--transition-smooth);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary), transparent);
            opacity: 0;
            transition: opacity var(--transition-smooth);
        }

        .card:hover {
            border-color: var(--border-active);
            box-shadow: var(--shadow-md);
        }

        .card:hover::before {
            opacity: 1;
        }

        .card-icon {
            font-size: 1.8rem;
            margin-bottom: 16px;
            display: block;
        }

        .card h4 {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.01em;
        }

        .card p {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 0;
        }

        .checklist {
            list-style: none;
            padding: 0;
            margin: 24px 0;
        }

        .checklist li {
            padding: 14px 16px;
            margin-bottom: 10px;
            background: var(--bg-secondary);
            border-radius: var(--radius-sm);
            border-left: 3px solid var(--accent-primary);
            display: flex;
            align-items: flex-start;
            gap: 12px;
            font-size: 0.95rem;
            color: var(--text-secondary);
            transition: background var(--transition-fast);
        }

        .checklist li:hover {
            background: var(--bg-card);
        }

        .checklist .check-icon {
            color: var(--accent-primary);
            font-weight: 700;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .warning-box {
            background: rgba(212, 175, 55, 0.06);
            border: 1px solid var(--border-active);
            border-radius: var(--radius-md);
            padding: 24px;
            margin: 28px 0;
        }

        .warning-box h4 {
            color: var(--accent-primary);
            margin-bottom: 8px;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .warning-box p {
            color: var(--text-secondary);
            margin: 0;
            font-size: 0.95rem;
        }

        .faq-list {
            list-style: none;
            padding: 0;
            margin: 28px 0;
        }

        .faq-list li {
            padding: 20px 0;
            border-bottom: 1px solid var(--border-subtle);
        }

        .faq-list li:last-child {
            border-bottom: none;
        }

        .faq-list .question {
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text-primary);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .faq-list .question .q-marker {
            color: var(--accent-primary);
            font-size: 1.3rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .faq-list .answer {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.7;
            margin-left: 28px;
        }

        .comparison-table {
            width: 100%;
            border-collapse: collapse;
            margin: 28px 0;
            font-size: 0.9rem;
        }

        .comparison-table th {
            background: var(--bg-card);
            padding: 14px 16px;
            text-align: left;
            font-weight: 700;
            color: var(--accent-primary);
            border-bottom: 2px solid var(--border-active);
            letter-spacing: 0.03em;
            font-size: 0.85rem;
            text-transform: uppercase;
        }

        .comparison-table td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-subtle);
            color: var(--text-secondary);
        }

        .comparison-table tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }

        .comparison-table .highlight {
            color: var(--accent-primary);
            font-weight: 600;
        }

        .tag {
            display: inline-block;
            background: var(--accent-dim);
            color: var(--accent-primary);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            margin-right: 6px;
            margin-bottom: 6px;
        }

        footer {
            margin-top: 64px;
            padding: 32px 0;
            border-top: 1px solid var(--border-subtle);
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        footer a {
            color: var(--accent-primary);
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 640px) {
            .container {
                padding: 0 16px;
            }

            nav .container {
                flex-direction: column;
                align-items: flex-start;
            }

            .nav-links {
                gap: 12px;
            }

            .page-header {
                padding: 32px 0 28px;
            }

            .card-grid {
                grid-template-columns: 1fr;
            }

            .comparison-table {
                font-size: 0.8rem;
            }

            .comparison-table th,
            .comparison-table td {
                padding: 10px 8px;
            }
        }
    </style>
